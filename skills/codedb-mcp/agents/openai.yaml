interface:
  display_name: "codedb-mcp"
  short_description: "Query exact repository evidence through a local property graph"
  default_prompt: >-
    Use codedb_* for repository source analysis. If the human's question is not
    English, translate it once while preserving identifiers, paths, literals,
    errors, uncertainty, and code exactly. The server treats task text as an
    opaque label; do not derive keywords, synonyms, filename guesses,
    morphology, language boosts, or domain boosts.

    Start with codedb_graph_query. When no exact symbol, path, state, or
    endpoint is known, query EntryFile and BoundaryFile labels; use Community
    nodes to select a structural region, and never list every File for entry
    discovery. Query cross-community DEPENDS_ON bridges with source.community
    != target.community. Put exact name/path predicates on known endpoints; the
    planner starts from the more selective endpoint, including reverse caller
    and REFERENCES queries. Use MATCH SHORTEST with finite
    CALLS|DISPATCHES_TO paths for exact endpoint connectors. Use HAS_CALLSITE
    -> ARGUMENT -> Value ->
    BINDS_TO -> Parameter to preserve argument roles. Use HAS_PARAMETER ->
    USED_IN -> Condition and TRUE/FALSE -> ControlAction -> PREVENTS/REACHES
    for branch outcomes. Use READS/WRITES joins for shared-state consumers and
    producers.

    A CALLS edge proves a handoff only. It does not prove filtering,
    inclusion/exclusion, fallback, retry, or selection semantics. Keep
    DISPATCHES_TO implementations mutually exclusive until construction or
    assignment evidence selects one. A preprocessor guard belongs only to the
    call fact carrying it. Prefer incoming patterns when the target is already
    exact.

    Read codedb_symbol body=true max_results=1 only for local semantics missing
    from graph facts. Use codedb_outline once after a missing exact name in a
    known file; never probe invented lifecycle siblings. Use codedb_read only
    for an exact range. There is no call quota: reduce tokens by finding the
    evidence chain earlier, not by truncating it. Once codedb source lookup
    starts, do not switch to shell/rg unless the human explicitly asks for the
    no-MCP benchmark control.
